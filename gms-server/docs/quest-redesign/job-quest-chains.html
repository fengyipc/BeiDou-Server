function renderDAG(b){
  document.getElementById("title").style.color=b.color;document.getElementById("title").textContent=b.branch;
  const dag=document.getElementById("dag"),byLayer={};
  b.nodes.forEach(n=>{(byLayer[n.layer]=byLayer[n.layer]||[]).push(n)});
  const mxL=Math.max(0,...b.nodes.map(n=>n.layer));
  const cM={},pM={};b.nodes.forEach(n=>{cM[n.id]=[];pM[n.id]=[]});
  b.edges.forEach(e=>{if(cM[e.f])cM[e.f].push(e.t);if(pM[e.t])pM[e.t].push(e.f)});
  const pos={};
  for(let l=0;l<=mxL;l++){const a=byLayer[l]||[];a.sort((a,c)=>a.name.localeCompare(c.name));a.forEach((n,i)=>{pos[n.id]={x:l,yi:i}})}
  for(let p=0;p<4;p++){
    for(let l=1;l<=mxL;l++){const a=byLayer[l]||[];a.forEach(n=>{const pr=pM[n.id];if(pr.length)pos[n.id].yi=pr.reduce((s,p)=>s+(pos[p]?pos[p].yi:0),0)/pr.length});a.sort((a,c)=>pos[a.id].yi-pos[c.id].yi);a.forEach((n,i)=>{pos[n.id].yi=i})}
    for(let l=mxL-1;l>=0;l--){const a=byLayer[l]||[];a.forEach(n=>{const ch=cM[n.id];if(ch.length)pos[n.id].yi=ch.reduce((s,c)=>s+(pos[c]?pos[c].yi:0),0)/ch.length});a.sort((a,c)=>pos[a.id].yi-pos[c.id].yi);a.forEach((n,i)=>{pos[n.id].yi=i})}
  }
  const nH={};b.nodes.forEach(n=>{let h=NH;if(n.reqs.length)h+=10+n.reqs.length*13;if(n.rewards.length)h+=10+n.rewards.length*13;nH[n.id]=h});
  const lY={};for(let l=0;l<=mxL;l++){const a=byLayer[l]||[];let cy=PAD;a.forEach(n=>{lY[n.id]=cy;cy+=nH[n.id]+VG})}
  const tW=(mxL+1)*LG+PAD*2,tH=Math.max(300,...Object.keys(lY).map(id=>lY[id]+nH[id]))+PAD;
  nPos={};let html='';
  b.nodes.forEach(n=>{
    const x=PAD+pos[n.id].x*LG,y=lY[n.id],h=nH[n.id];nPos[n.id]={x,y,w:NW,h};
    html+=`<div class="nd" id="n${n.id}" data-id="${n.id}" data-jc="${n.jc.join(',')}" data-lvmin="${n.lvmin}" data-lvmax="${n.lvmax}" style="left:${x}px;top:${y}px;width:${NW}px" onmouseenter="ho('${n.id}')" onmouseleave="hx()">`;
    html+=`<div class="h"><span class="id" style="background:${b.color}">#${n.id}</span><span class="nm">${esc(n.name)}</span></div>`;
    html+=`<div class="ln">${esc(n.line)}</div><div class="r">`;
    if(n.lv)html+=`<b>${n.lv}</b> · `;
    html+=esc(n.jobs);
    if(n.npc_s)html+=`<br><span class="npc">接:${nn(n.npc_s)}</span>`;
    if(n.npc_e&&n.npc_e!==n.npc_s)html+=` <span class="npc">交:${nn(n.npc_e)}</span>`;
    html+=`</div>`;
    if(n.reqs.length){html+=`<div class="sec">`;n.reqs.forEach(r=>{html+=`<span class="tg ti">${esc(r)}</span>`});html+=`</div>`}
    if(n.rewards.length){html+=`<div class="sec">`;n.rewards.forEach(r=>{let c='tr';if(r.includes('技能'))c='ts';if(r.includes('转职'))c='tj';html+=`<span class="tg ${c}">${esc(r)}</span>`});html+=`</div>`}
    html+=`</div>`;
  });
  html+=`<svg class="edges" width="${tW}" height="${tH}"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9" fill="#555"/></marker><marker id="ahx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9" fill="#f39c12"/></marker></defs>`;
  b.edges.forEach(e=>{
    const s=nPos[e.f],t=nPos[e.t];if(!s||!t)return;
    const x1=s.x+s.w,y1=s.y+s.h/2,x2=t.x,y2=t.y+t.h/2,dx=Math.abs(x2-x1),cx=dx*0.4;
    const col=e.x?'#f39c12':'#555',dash=e.x?'stroke-dasharray="6,4"':'',mk=e.x?'url(#ahx)':'url(#ah)';
    html+=`<path class="edge" data-f="${e.f}" data-t="${e.t}" d="M${x1},${y1} C${x1+cx},${y1} ${x2-cx},${y2} ${x2},${y2}" stroke="${col}" stroke-width="1.8" fill="none" ${dash} marker-end="${mk}" opacity="0.7"/>`;
  });
  html+=`</svg>`;dag.style.width=tW+'px';dag.style.height=tH+'px';dag.innerHTML=html;af();
}
function af(){
  const kw=document.getElementById("sf").value.toLowerCase(),fLvMin=parseInt(document.getElementById("fLvMin").value)||0,fLvMax=parseInt(document.getElementById("fLvMax").value)||999;
  document.querySelectorAll('.nd').forEach(el=>{
    const id=el.dataset.id||'',nm=el.querySelector('.nm'),name=nm?nm.textContent.toLowerCase():'';
    const jc=(el.dataset.jc||'').split(','),nLvMin=parseInt(el.dataset.lvmin)||0,nLvMax=parseInt(el.dataset.lvmax)||999;
    let show=true;
    if(kw&&!name.includes(kw)&&!id.includes(kw))show=false;
    if(ajf!=='all'&&!jc.includes(ajf)&&!jc.includes('all'))show=false;
    if(fLvMin>0&&nLvMax<fLvMin)show=false;
    if(fLvMax<999&&nLvMin>fLvMax)show=false;
    el.style.opacity=show?'1':'0.1';el.style.pointerEvents=show?'auto':'none';
  });
  document.querySelectorAll('.edge').forEach(el=>{
    const fN=document.getElementById('n'+el.dataset.f),tN=document.getElementById('n'+el.dataset.t);
    const fV=fN&&parseFloat(fN.style.opacity)>0.5,tV=tN&&parseFloat(tN.style.opacity)>0.5;
    el.style.opacity=(fV&&tV)?'0.7':'0.05';
  });
}
function ho(id){
  if(!curB)return;const cn=new Set([id]);
  curB.edges.forEach(e=>{if(e.f===id)cn.add(e.t);if(e.t===id)cn.add(e.f)});
  document.querySelectorAll('.nd').forEach(el=>{if(parseFloat(el.style.opacity||'1')<0.5)return;el.classList.toggle('hl',cn.has(el.dataset.id));el.classList.toggle('dim',!cn.has(el.dataset.id))});
  document.querySelectorAll('.edge').forEach(el=>{const on=(el.dataset.f===id||el.dataset.t===id);el.style.opacity=on?'1':'0.05';el.style.strokeWidth=on?'2.5':'1.8'});
}
